<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Run 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { background: #03030a; overflow: hidden; font-family: sans-serif; font-weight: 900; }
        
        @keyframes neonPulse {
            0% { box-shadow: 0 0 10px rgba(0,255,255,0.4); }
            50% { box-shadow: 0 0 25px rgba(0,255,255,0.8); }
            100% { box-shadow: 0 0 10px rgba(0,255,255,0.4); }
        }
        
        @keyframes newBestPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #0f0); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 20px #0f0); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px #0f0); }
        }

        .neon-btn {
            border: 2px solid #0ff;
            border-radius: 6px;
            background: #000;
            color: #0ff;
            padding: 12px 28px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 900;
            animation: neonPulse 2s infinite;
            transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            text-shadow: 0 0 8px #0ff;
            margin: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .neon-btn:hover { background: rgba(0, 255, 255, 0.15); }
        .neon-btn:active { transform: scale(0.95); }
        .neon-btn.purple { border-color: #f0f; color: #f0f; text-shadow: 0 0 8px #f0f; }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        #hud {
            position: fixed;
            top: 25px;
            left: 25px;
            font-size: 20px;
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
            z-index: 20;
            display: none;
            pointer-events: none;
        }

        .overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(15,10,35,0.95) 0%, rgba(5,5,15,0.98) 100%);
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
            max-width: 500px;
            width: 90%;
        }

        .shop-item {
            border: 1px solid #0ff;
            background: rgba(0,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .new-best-anim {
            display: inline-block;
            color: #0f0;
            font-size: 28px;
            animation: newBestPulse 1s infinite;
            margin: 10px 0;
        }

        /* On-Screen Mobile Touch Controls */
        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 25;
            pointer-events: none;
            box-sizing: border-box;
        }
        .ctrl-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .mob-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 255, 255, 0.15);
            border: 2px solid #0ff;
            border-radius: 50%;
            color: #0ff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 8px #0ff;
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }
        .mob-btn:active {
            background: rgba(0, 255, 255, 0.4);
            transform: scale(0.92);
        }
        #mob-jump {
            pointer-events: auto;
            background: rgba(255, 0, 255, 0.15);
            border-color: #f0f;
            color: #f0f;
            text-shadow: 0 0 8px #f0f;
            box-shadow: 0 0 10px rgba(255,0,255,0.3);
        }
        #mob-jump:active {
            background: rgba(255, 0, 255, 0.4);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hud"></div>

    <!-- ON-SCREEN MOBILE CONTROLS -->
    <div id="mobile-controls">
        <div class="ctrl-group">
            <div id="mob-left" class="mob-btn">◀</div>
            <div id="mob-right" class="mob-btn">▶</div>
        </div>
        <div class="ctrl-group">
            <div id="mob-jump" class="mob-btn">▲</div>
        </div>
    </div>

    <!-- AUDIO TOGGLE -->
    <button id="btn-music" class="neon-btn" style="position: fixed; top: 15px; right: 15px; z-index: 100; padding: 8px 16px; font-size: 14px; animation: none;">🎵 ON</button>

    <!-- MAIN MENU -->
    <div id="main-menu" class="overlay-screen">
        <h1 style="font-size: 56px; margin: 0; text-shadow: 0 0 15px #0ff;">CYBER RUN</h1>
        <div id="menu-high-score" style="color: #ffd700; margin: 10px 0; font-size: 22px;">HIGH SCORE: 0</div>
        <div id="menu-credits" style="color: #0ff; margin-bottom: 15px; font-size: 18px;">TOTAL CREDITS: 0</div>
        <div>
            <button id="btn-play" class="neon-btn">PLAY GAME</button>
            <button id="btn-market" class="neon-btn purple">MARKETPLACE</button>
        </div>
    </div>

    <!-- MARKETPLACE -->
    <div id="market-menu" class="overlay-screen" style="display: none;">
        <h2 style="font-size: 38px; color: #f0f; text-shadow: 0 0 12px #f0f;">CYBER MARKET</h2>
        <div id="market-credits" style="color: #ffd700; font-size: 20px; margin: 10px 0;">CREDITS: 0</div>
        
        <div class="shop-grid">
            <div class="shop-item">
                <div style="color:#0f0;">Magnet Boost</div>
                <div style="font-size: 12px; color:#aaa; margin: 5px 0;">+2s Magnet Time</div>
                <button id="buy-magnet" class="neon-btn" style="font-size:14px; padding:6px 12px;">100 CR</button>
            </div>
            <div class="shop-item">
                <div style="color:#f0f;">Cyan Trail</div>
                <div style="font-size: 12px; color:#aaa; margin: 5px 0;">Skin Cosmetic</div>
                <button id="buy-skin" class="neon-btn purple" style="font-size:14px; padding:6px 12px;">250 CR</button>
            </div>
        </div>
        <button id="btn-market-back" class="neon-btn">BACK TO MENU</button>
    </div>

    <script>
    const SafeStorage = {
        data: {},
        getItem(key) {
            try { return localStorage.getItem(key); }
            catch(e) { return this.data[key] || null; }
        },
        setItem(key, val) {
            try { localStorage.setItem(key, val); }
            catch(e) { this.data[key] = String(val); }
        }
    };

    class AudioSystem {
        constructor() {
            this.ctx = null;
            this.interval = null;
            this.melody = [110, 130, 146, 165, 196];
            this.step = 0;
            this.coinCombo = 0;
            this.tempo = 180;
            this.isMuted = SafeStorage.getItem('cyber_muted') === 'true';
        }
        init() {
            if (this.ctx) return;
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.startMusic();
        }
        toggleMute() {
            this.isMuted = !this.isMuted;
            SafeStorage.setItem('cyber_muted', this.isMuted.toString());
            if (!this.isMuted && !this.ctx) {
                this.init();
            } else if (!this.isMuted && this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            return this.isMuted;
        }
        startMusic() {
            if (this.interval) clearInterval(this.interval);
            this.interval = setInterval(() => {
                if (!this.ctx || this.isMuted) return;
                let o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime;
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(this.melody[this.step % this.melody.length], t);
                g.gain.setValueAtTime(0.04, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
                o.connect(g); g.connect(this.ctx.destination);
                o.start(t); o.stop(t + 0.4);
                this.step++;
            }, this.tempo);
        }
        setTempo(speedRatio) {
            let newTempo = Math.max(90, 180 - (speedRatio * 50));
            if (Math.abs(this.tempo - newTempo) > 10) {
                this.tempo = newTempo;
                if (this.ctx) this.startMusic();
            }
        }
        playCoinSound() {
            if (!this.ctx || this.isMuted) return;
            if (this.ctx.state === 'suspended') this.ctx.resume();
            let o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime;
            let baseFreq = 440 + (this.coinCombo * 60);
            o.type = 'sine';
            o.frequency.setValueAtTime(Math.min(baseFreq, 1600), t);
            g.gain.setValueAtTime(0.1, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            o.connect(g); g.connect(this.ctx.destination);
            o.start(t); o.stop(t + 0.15);
            this.coinCombo++;
        }
        resetCombo() { this.coinCombo = 0; }
    }

    class InputManager {
        constructor(game) {
            this.game = game;
            this.touchX = 0;
            this.touchY = 0;
            this.bindEvents();
        }
        vibrate(pattern) {
            if ('vibrate' in navigator) navigator.vibrate(pattern);
        }
        bindEvents() {
            const leftBtn = document.getElementById('mob-left');
            const rightBtn = document.getElementById('mob-right');
            const jumpBtn = document.getElementById('mob-jump');

            leftBtn.addEventListener('touchstart', e => {
                e.preventDefault();
                if (!this.game.gO && !this.game.inM && this.game.cL > 0) this.game.cL--;
            }, { passive: false });

            rightBtn.addEventListener('touchstart', e => {
                e.preventDefault();
                if (!this.game.gO && !this.game.inM && this.game.cL < 2) this.game.cL++;
            }, { passive: false });

            jumpBtn.addEventListener('touchstart', e => {
                e.preventDefault();
                if (this.game.gO) { this.game.restart(); return; }
                if (!this.game.inM && !this.game.isJ) {
                    this.game.isJ = 1;
                    this.game.jV = 0.17;
                }
            }, { passive: false });

            window.addEventListener('touchstart', e => {
                if (e.target.id === 'btn-music' || e.target.classList.contains('mob-btn')) return;
                this.touchX = e.touches[0].clientX;
                this.touchY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', e => {
                if (e.target.id === 'btn-music' || e.target.classList.contains('mob-btn')) return;
                if (this.game.gO) { this.game.restart(); return; }
                if (this.game.inM) return;
                let dx = e.changedTouches[0].clientX - this.touchX;
                let dy = e.changedTouches[0].clientY - this.touchY;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 30 && this.game.cL < 2) this.game.cL++;
                    else if (dx < -30 && this.game.cL > 0) this.game.cL--;
                } else {
                    if (dy < -30 && !this.game.isJ) { this.game.isJ = 1; this.game.jV = 0.17; }
                }
            }, { passive: true });

            window.addEventListener('keydown', e => {
                if (e.key === 'Escape') { this.game.showMainMenu(); return; }
                if (this.game.gO && (e.key === ' ' || e.key === 'Spacebar')) { this.game.restart(); return; }
                if (this.game.gO || this.game.inM) return;
                if (e.key === 'ArrowLeft' && this.game.cL > 0) this.game.cL--;
                if (e.key === 'ArrowRight' && this.game.cL < 2) this.game.cL++;
                if ((e.key === ' ' || e.key === 'ArrowUp') && !this.game.isJ) { this.game.isJ = 1; this.game.jV = 0.17; }
            });
        }
    }

    class WebGLRenderer {
        constructor(canvas) {
            this.c = canvas;
            this.gl = canvas.getContext('webgl');
            this.shakeTimer = 0;
            this.initShaders();
            this.initBuffers();
        }
        initShaders() {
            const gl = this.gl;
            const vCode = `
                attribute vec4 p;
                uniform mat4 m, pr;
                varying float h;
                varying float vDepth;
                void main() {
                    vec4 pos = pr * m * p;
                    gl_Position = pos;
                    h = p.y + 0.5;
                    vDepth = pos.z;
                }
            `;
            const fCode = `
                precision mediump float;
                uniform vec4 c;
                uniform float uGlow;
                varying float h;
                varying float vDepth;
                void main() {
                    vec3 emissive = c.rgb * (0.4 + h * 0.6) * uGlow;
                    vec3 fogColor = vec3(0.02, 0.01, 0.05);
                    float fogFactor = clamp((35.0 - vDepth) / (35.0 - 5.0), 0.0, 1.0);
                    vec3 finalColor = mix(fogColor, emissive, fogFactor);
                    gl_FragColor = vec4(finalColor, c.a);
                }
            `;
            let v = gl.createShader(35633), f = gl.createShader(35632);
            gl.shaderSource(v, vCode); gl.compileShader(v);
            gl.shaderSource(f, fCode); gl.compileShader(f);
            
            this.P = gl.createProgram();
            gl.attachShader(this.P, v); gl.attachShader(this.P, f);
            gl.linkProgram(this.P); gl.useProgram(this.P);
            this.ap = gl.getAttribLocation(this.P, 'p');
            this.um = gl.getUniformLocation(this.P, 'm');
            this.up = gl.getUniformLocation(this.P, 'pr');
            this.uc = gl.getUniformLocation(this.P, 'c');
            this.uGlow = gl.getUniformLocation(this.P, 'uGlow');
        }
        initBuffers() {
            const gl = this.gl;
            this.vB = gl.createBuffer();
            this.iB = gl.createBuffer();
            gl.bindBuffer(34962, this.vB);
            gl.bufferData(34962, new Float32Array([
                -0.4,-0.4,0.4, 0.4,-0.4,0.4, 0.4,0.4,0.4, -0.4,0.4,0.4,
                -0.4,-0.4,-0.4, -0.4,0.4,-0.4, 0.4,0.4,-0.4, 0.4,-0.4,-0.4,
                -0.4,0.4,-0.4, -0.4,0.4,0.4, 0.4,0.4,0.4, 0.4,0.4,-0.4,
                -0.4,-0.4,-0.4, 0.4,-0.4,-0.4, 0.4,-0.4,0.4, -0.4,-0.4,0.4,
                -0.03,0,-1, 0.03,0,-1, 0.03,0,1, -0.03,0,1,
                -0.15,-0.15,0, 0.15,-0.15,0, 0.15,0.15,0, -0.15,0.15,0
            ]), 35044);
            gl.bindBuffer(34963, this.iB);
            gl.bufferData(34963, new Uint16Array([
                0,1,2,0,2,3, 4,5,6,4,6,7, 8,9,10,8,10,11,
                12,13,14,12,14,15, 16,17,18,16,18,19, 20,21,22,20,22,23
            ]), 35044);
        }
        mat(x, y, z, rY = 0, sY = 1, tiltZ = 0) {
            let syM = Math.sin(rY), cY = Math.cos(rY);
            let cZ = Math.cos(tiltZ), sZ = Math.sin(tiltZ);
            
            return new Float32Array([
                cY * cZ, sZ, -syM, 0,
                syM * .47 - sZ, .88 * sY * cZ, cY * .47, 0,
                syM * .88, -.47 * sY, cY * .88, 0,
                x, y * .88 - z * .47 - 2.3, y * .47 + z * .88 - 5.8, 1
            ]);
        }
        render(dt, pX, pY, dtFactor) {
            const gl = this.gl;
            if (this.c.width !== window.innerWidth || this.c.height !== window.innerHeight) {
                this.c.width = window.innerWidth; this.c.height = window.innerHeight;
                gl.viewport(0, 0, this.c.width, this.c.height);
            }
            gl.clearColor(0.02, 0.01, 0.05, 1);
            gl.clear(16640); gl.enable(2929);
            let f = 1 / Math.tan(0.42), nf = 1 / (0.1 - 100);
            let proj = new Float32Array([f / (this.c.width / this.c.height), 0, 0, 0, 0, f, 0, 0, 0, 0, 100.1 * nf, -1, 0, 0, 20 * nf, 0]);
            if (this.shakeTimer > 0) {
                this.shakeTimer -= dt;
                proj[12] += (Math.random() - 0.5) * 0.15;
                proj[13] += (Math.random() - 0.5) * 0.15;
            }
            gl.uniformMatrix4fv(this.up, false, proj);
            gl.vertexAttribPointer(this.ap, 3, 5126, false, 0, 0);
            gl.enableVertexAttribArray(this.ap);
        }
    }

    class CyberRunGame {
        constructor() {
            this.canvas = document.getElementById('canvas');
            this.hud = document.getElementById('hud');
            this.mainMenu = document.getElementById('main-menu');
            this.marketMenu = document.getElementById('market-menu');
            this.mobileControls = document.getElementById('mobile-controls');
            
            this.audio = new AudioSystem();
            this.input = new InputManager(this);
            this.renderer = new WebGLRenderer(this.canvas);
            
            this.lanes = [-1.4, 0, 1.4];
            this.cL = 1; this.pX = 0; this.pY = -0.4;
            this.jV = 0; this.isJ = 0;
            this.obs = []; this.coins = []; this.items = [];
            this.score = 0; this.coinsCount = 0; this.spd = 0.30;
            this.gO = 0; this.inM = 1;
            
            this.boostTimer = 0;
            this.slowTimer = 0;
            this.magnetTimer = 0;
            this.totalCredits = parseInt(SafeStorage.getItem('cyber_credits') || '0');
            this.highScore = parseInt(SafeStorage.getItem('cyber_high_score') || '0');
            this.magnetUpgraded = SafeStorage.getItem('cyber_magnet_up') === 'true';
            this.lastTime = 0;
            
            this.initUI();
            this.showMainMenu();
        }
        initUI() {
            let musicBtn = document.getElementById('btn-music');
            const updateMusicBtn = () => {
                musicBtn.innerText = this.audio.isMuted ? '🎵 OFF' : '🎵 ON';
                musicBtn.style.color = this.audio.isMuted ? '#888' : '#0ff';
                musicBtn.style.borderColor = this.audio.isMuted ? '#888' : '#0ff';
                musicBtn.style.textShadow = this.audio.isMuted ? 'none' : '0 0 8px #0ff';
            };
            updateMusicBtn();
            
            musicBtn.onclick = () => {
                this.audio.toggleMute();
                updateMusicBtn();
            };
            document.getElementById('btn-play').onclick = () => {
                this.audio.init();
                this.inM = 0;
                this.init();
                this.loop(performance.now());
            };
            document.getElementById('btn-market').onclick = () => this.showMarket();
            document.getElementById('btn-market-back').onclick = () => this.showMainMenu();
            document.getElementById('buy-magnet').onclick = () => {
                if (this.totalCredits >= 100 && !this.magnetUpgraded) {
                    this.totalCredits -= 100;
                    this.magnetUpgraded = true;
                    SafeStorage.setItem('cyber_credits', this.totalCredits);
                    SafeStorage.setItem('cyber_magnet_up', 'true');
                    this.updateMarketUI();
                }
            };
            this.uUI = () => {
                let status = this.boostTimer > 0 ? ' <span style="color:#0f0">[BOOST!]</span>' :
                            (this.slowTimer > 0 ? ' <span style="color:#f0f">[SLOWED]</span>' :
                            (this.magnetTimer > 0 ? ' <span style="color:#0ff">[MAGNET!]</span>' : ''));
                this.hud.innerHTML = `SCORE: ${Math.floor(this.score)} | BEST: ${this.highScore} | CREDITS: ${this.coinsCount}${status}`;
            };
        }
        showMainMenu() {
            this.inM = 1;
            this.gO = 0;
            this.mainMenu.style.display = 'flex';
            this.marketMenu.style.display = 'none';
            this.hud.style.display = 'none';
            this.mobileControls.style.display = 'none';
            document.getElementById('menu-high-score').innerText = `HIGH SCORE: ${this.highScore}`;
            document.getElementById('menu-credits').innerText = `TOTAL CREDITS: ${this.totalCredits}`;
        }
        showMarket() {
            this.mainMenu.style.display = 'none';
            this.marketMenu.style.display = 'flex';
            this.mobileControls.style.display = 'none';
            this.updateMarketUI();
        }
        updateMarketUI() {
            document.getElementById('market-credits').innerText = `CREDITS: ${this.totalCredits}`;
            let buyMagBtn = document.getElementById('buy-magnet');
            if (this.magnetUpgraded) {
                buyMagBtn.innerText = 'OWNED';
                buyMagBtn.disabled = true;
                buyMagBtn.style.opacity = '0.5';
            }
        }
        init() {
            this.cL = 1; this.pX = 0; this.pY = -0.4; this.jV = 0; this.isJ = 0;
            this.obs = []; this.coins = []; this.items = [];
            this.score = 0; this.coinsCount = 0; this.spd = 0.30;
            this.gO = 0; this.boostTimer = 0; this.slowTimer = 0; this.magnetTimer = 0;
            this.audio.resetCombo();
            
            this.hud.style.display = 'block';
            this.mobileControls.style.display = 'flex';
            this.hud.style.cssText = 'position:fixed;top:25px;left:25px;font-size:20px;color:#0ff;text-shadow:0 0 8px #0ff;z-index:20;display:block;';
            this.mainMenu.style.display = 'none';
            this.marketMenu.style.display = 'none';
            
            this.uUI();
            this.sp(); this.spC(); this.spI();
        }
        restart() { this.init(); this.loop(performance.now()); }
        sp() {
            if (this.gO || this.inM) return;
            this.obs.push({ x: this.lanes[Math.floor(Math.random() * 3)], z: -45, hScale: Math.random() > 0.5 ? 1.8 : 1.0 });
            setTimeout(() => this.sp(), Math.random() * 400 + 350);
        }
        spC() {
            if (this.gO || this.inM) return;
            if (Math.random() > .3) this.coins.push({ x: this.lanes[Math.floor(Math.random() * 3)], z: -45 });
            setTimeout(() => this.spC(), 300);
        }
        spI() {
            if (this.gO || this.inM) return;
            if (Math.random() > .4) {
                let types = ['b', 's', 'm'];
                this.items.push({ x: this.lanes[Math.floor(Math.random() * 3)], z: -45, t: types[Math.floor(Math.random() * 3)] });
            }
            setTimeout(() => this.spI(), Math.random() * 2000 + 1500);
        }
        loop(timestamp) {
            if (this.gO || this.inM) return;
            requestAnimationFrame(t => this.loop(t));
            let dt = this.lastTime ? (timestamp - this.lastTime) / 1000 : 0.016;
            this.lastTime = timestamp;
            if (dt > 0.1) dt = 0.1;
            let dtFactor = dt * 60;
            this.renderer.render(dt, this.pX, this.pY, dtFactor);
            if (this.boostTimer > 0) this.boostTimer -= dtFactor;
            if (this.slowTimer > 0) this.slowTimer -= dtFactor;
            if (this.magnetTimer > 0) this.magnetTimer -= dtFactor;
            let modSpd = this.spd * (this.boostTimer > 0 ? 1.6 : (this.slowTimer > 0 ? 0.5 : 1.0));
            let dynamicSpd = (this.inM ? 0.03 : modSpd + Math.sin(this.score * 0.01) * 0.05) * dtFactor;
            this.audio.setTempo(modSpd);
            this.pX += (this.lanes[this.cL] - this.pX) * (0.2 * dtFactor);
            let camTiltZ = -this.pX * 0.05;
            if (this.isJ) {
                this.pY += this.jV * dtFactor;
                this.jV -= 0.012 * dtFactor;
                if (this.pY <= -0.4) { this.pY = -0.4; this.isJ = 0; }
            }
            const gl = this.renderer.gl;
            gl.uniformMatrix4fv(this.renderer.um, false, this.renderer.mat(this.pX, this.pY, -6, 0, 1, camTiltZ));
            gl.uniform4fv(this.renderer.uc, this.boostTimer > 0 ? [0, 1, 0.4, 1] : [0, 1, 1, 1]);
            gl.uniform1f(this.renderer.uGlow, 1.8);
            gl.drawElements(4, 24, 5123, 0);
            for (let i = this.coins.length - 1; i >= 0; i--) {
                let o = this.coins[i];
                o.z += dynamicSpd;
                if (this.magnetTimer > 0 && o.z > -15) {
                    o.x += (this.pX - o.x) * 0.15 * dtFactor;
                }
                if (Math.abs(o.x - this.pX) < 0.5 && o.z > -6.6 && o.z < -5.4) {
                    this.coins.splice(i, 1);
                    this.coinsCount++; this.score += 50;
                    this.audio.playCoinSound();
                    this.input.vibrate(50);
                    this.uUI(); continue;
                }
                if (o.z > 1) { this.coins.splice(i, 1); continue; }
                gl.uniformMatrix4fv(this.renderer.um, false, this.renderer.mat(o.x, -0.2, o.z));
                gl.uniform4fv(this.renderer.uc, [1, 0.85, 0, 1]);
                gl.uniform1f(this.renderer.uGlow, 1.5);
                gl.drawElements(4, 6, 5123, 60);
            }
            for (let i = this.items.length - 1; i >= 0; i--) {
                let it = this.items[i]; it.z += dynamicSpd;
                if (Math.abs(it.x - this.pX) < 0.6 && it.z > -6.6 && it.z < -5.4) {
                    if (it.t === 'b') { this.boostTimer = 180; this.slowTimer = 0; }
                    else if (it.t === 's') { this.slowTimer = 180; this.boostTimer = 0; }
                    else if (it.t === 'm') { this.magnetTimer = this.magnetUpgraded ? 420 : 300; }
                    this.input.vibrate(80);
                    this.items.splice(i, 1); this.uUI(); continue;
                }
                if (it.z > 1) { this.items.splice(i, 1); continue; }
                gl.uniformMatrix4fv(this.renderer.um, false, this.renderer.mat(it.x, -0.2, it.z));
                gl.uniform4fv(this.renderer.uc, it.t === 'b' ? [0, 1, 0.2, 1] : (it.t === 's' ? [0.9, 0, 0.9, 1] : [0, 0.8, 1, 1]));
                gl.uniform1f(this.renderer.uGlow, 2.0);
                gl.drawElements(4, 6, 5123, 60);
            }
            for (let i = this.obs.length - 1; i >= 0; i--) {
                let o = this.obs[i]; o.z += dynamicSpd;
                if (Math.abs(o.x - this.pX) < 0.65 && o.z > -6.6 && o.z < -5.4 && this.pY < 0.2) {
                    this.gO = 1;
                    this.renderer.shakeTimer = 0.15;
                    this.input.vibrate([100, 50, 100]);
                    this.mobileControls.style.display = 'none';
                    this.totalCredits += this.coinsCount;
                    SafeStorage.setItem('cyber_credits', this.totalCredits);
                    let newBest = false;
                    if (Math.floor(this.score) > this.highScore) {
                        this.highScore = Math.floor(this.score);
                        SafeStorage.setItem('cyber_high_score', this.highScore);
                        newBest = true;
                    }
                    this.hud.innerHTML = `GAME OVER<br>` + 
                         (newBest ? `<span class="new-best-anim">NEW BEST!</span><br>` : '') + 
                         `<span style="font-size:18px;color:#888;">SCORE: ${Math.floor(this.score)}</span><br>` + 
                         `<button class="neon-btn" onclick="window.game.restart()">RETRY</button>` + 
                         `<button class="neon-btn purple" onclick="window.game.showMainMenu()">MENU</button>`;
                    this.hud.style.cssText += 'top:50%;left:50%;transform:translate(-50%,-50%);color:#f14;font-size:44px;text-align:center;pointer-events:auto;';
                }
                if (o.z > 1) { this.obs.splice(i, 1); this.score += 10; this.spd += 0.002; this.uUI(); continue; }
                gl.uniformMatrix4fv(this.renderer.um, false, this.renderer.mat(o.x, -0.4, o.z, 0, o.hScale));
                gl.uniform4fv(this.renderer.uc, [1, 0, 0.25, 1]);
                gl.uniform1f(this.renderer.uGlow, 1.5);
                gl.drawElements(4, 24, 5123, 0);
            }
        }
    }
    window.game = new CyberRunGame();
    </script>
